name: Greenfield delivery report
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/greenfield-report.yml]
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
          POSTGRES_DB: ogiri_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ogiri -d ogiri_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OGIRI_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/ogiri_test
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 3a763b8305c7fdb41f5ded3779248ec7f28f4240
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Reproduce the delivered libraries and installed consumer
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress clean install > "$RUNNER_TEMP/delivery-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/delivery-build.log"; exit 1; }
          mvn --batch-mode --no-transfer-progress -f examples/spring-app/pom.xml verify >> "$RUNNER_TEMP/delivery-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/delivery-build.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/delivery-build.log"
      - name: Retrieve original mutation proof and create the pinned HTML report
        run: |
          set -euo pipefail
          gh run download 34089504401 --repo quantipixels/ogiri --name greenfield-proof --dir "$RUNNER_TEMP/original-proof"
          gh api repos/quantipixels/ogiri/git/blobs/051f965ed480399913380796bc477da180df6d2a --jq .content | base64 --decode > "$RUNNER_TEMP/report.py"
          python "$RUNNER_TEMP/report.py"
      - name: Verify the self-contained report in desktop and mobile Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser"
          npm --prefix "$RUNNER_TEMP/browser" install --ignore-scripts --no-audit --no-fund playwright@1.56.1
          gh api repos/quantipixels/ogiri/git/blobs/4f3d8bb61c53d0bcb4997fe877a78236171ab2b9 --jq .content | base64 --decode > "$RUNNER_TEMP/browser/check.cjs"
          if command -v google-chrome >/dev/null; then
            export CHROME_PATH="$(command -v google-chrome)"
          elif command -v chromium >/dev/null; then
            export CHROME_PATH="$(command -v chromium)"
          else
            "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install chromium
          fi
          node "$RUNNER_TEMP/browser/check.cjs"
      - name: Package exact source artifacts evidence and checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, os, shutil, subprocess
          out=Path(os.environ['RUNNER_TEMP'])/'ogiri-delivery'
          root=Path.cwd()
          with ZipFile(out/'ogiri-0.1.0-rebuilt.zip','w',ZIP_DEFLATED) as bundle:
              entries={}
              def add(path,name):
                  data=path.read_bytes(); bundle.writestr(name,data); entries[name]=hashlib.sha256(data).hexdigest()
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  if name: add(Path(name),'source/'+name)
              for module in ('ogiri','ogiri-spring-security'):
                  for jar in Path(module,'target').glob(module+'-0.1.0*.jar'): add(jar,'artifacts/'+jar.name)
              local=Path.home()/'.m2/repository/com/quantipixels/ogiri'
              for module in ('ogiri-parent','ogiri','ogiri-spring-security'):
                  p=local/module/'0.1.0'/f'{module}-0.1.0.pom'; add(p,'artifacts/'+p.name)
              for p in root.glob('**/target/surefire-reports/TEST-*.xml'): add(p,'passing-tests/'+p.relative_to(root).as_posix())
              proof=Path(os.environ['RUNNER_TEMP'])/'original-proof'
              mutation=next(proof.glob('**/mutations.json')).parent
              for p in mutation.rglob('*'):
                  if p.is_file(): add(p,'negative-controls/'+p.relative_to(mutation).as_posix())
              add(Path(os.environ['RUNNER_TEMP'])/'delivery-build.log','evidence/delivery-build.log')
              for p in sorted(out.iterdir()):
                  if p.is_file() and p.suffix!='.zip': add(p,p.name)
              bundle.writestr('SHA256SUMS',''.join(f'{digest}  {name}\n' for name,digest in sorted(entries.items())))
          for name in ('ogiri-greenfield-session.html','ogiri-0.1.0-rebuilt.zip'):
              p=out/name; print(name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          assert not subprocess.check_output(['git','status','--porcelain']).strip()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: html
        with:
          path: ${{ runner.temp }}/ogiri-delivery/ogiri-greenfield-session.html
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: bundle
        with:
          path: ${{ runner.temp }}/ogiri-delivery/ogiri-0.1.0-rebuilt.zip
          archive: false
          retention-days: 7
      - name: Verify raw artifact delivery bytes through the download API
        env:
          HTML_ARTIFACT_ID: ${{ steps.html.outputs.artifact-id }}
          BUNDLE_ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
        run: |
          set -euo pipefail
          gh api "repos/quantipixels/ogiri/actions/artifacts/$HTML_ARTIFACT_ID/zip" > "$RUNNER_TEMP/html-delivery.bin"
          gh api "repos/quantipixels/ogiri/actions/artifacts/$BUNDLE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/bundle-delivery.bin"
          python - <<'PY'
          from pathlib import Path
          import os, hashlib
          tmp=Path(os.environ['RUNNER_TEMP'])
          for delivered,original in [('html-delivery.bin','ogiri-greenfield-session.html'),('bundle-delivery.bin','ogiri-0.1.0-rebuilt.zip')]:
              data=(tmp/delivered).read_bytes(); expected=(tmp/'ogiri-delivery'/original).read_bytes()
              assert data==expected, f'Download API changed raw file packaging: {original}; prefix={data[:12]!r}'
              print('VERIFIED RAW DOWNLOAD',original,len(data),hashlib.sha256(data).hexdigest())
          PY
