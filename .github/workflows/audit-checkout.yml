name: Audit checkout
on:
  push:
    branches: [build/java-first-auth]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Split credential-free build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34059884872 --repo quantipixels/ogiri --name ogiri-offline-build --dir "$RUNNER_TEMP/offline"
          git bundle create "$RUNNER_TEMP/offline/ogiri.bundle" --all
          cd "$RUNNER_TEMP/offline"
          split -b 350M -d gradle-cache.tar.gz cache-
          mkdir support
          mv ogiri.bundle baseline.log jdk17.tar.gz support/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ogiri-cache-00
          path: ${{ runner.temp }}/offline/cache-00
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ogiri-cache-01
          path: ${{ runner.temp }}/offline/cache-01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ogiri-cache-02
          path: ${{ runner.temp }}/offline/cache-02
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ogiri-build-support
          path: ${{ runner.temp }}/offline/support
          retention-days: 1
          compression-level: 0
