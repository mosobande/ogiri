name: Audit checkout
on:
  push:
    branches: [build/java-first-auth]
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Baseline verification
        id: baseline
        continue-on-error: true
        run: ./gradlew check --no-daemon --continue > "$RUNNER_TEMP/baseline.log" 2>&1
      - name: Export offline build inputs and results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/offline"
          git bundle create "$RUNNER_TEMP/offline/ogiri.bundle" --all
          cp "$RUNNER_TEMP/baseline.log" "$RUNNER_TEMP/offline/"
          tar --exclude='*.lock' --exclude='gc.properties' -czf "$RUNNER_TEMP/offline/gradle-cache.tar.gz" -C "$HOME" .gradle/caches .gradle/wrapper
          tar -czf "$RUNNER_TEMP/offline/jdk17.tar.gz" -C "$JAVA_HOME" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ogiri-offline-build
          path: ${{ runner.temp }}/offline
          retention-days: 1
          compression-level: 0
