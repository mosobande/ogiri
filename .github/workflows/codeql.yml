name: CodeQL
on:
  pull_request:
  push:
    branches: [ori, build/ogiri-0.1.0]
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile library and standalone application for analysis
        run: |
          mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true -Dmaven.javadoc.skip=true install
          mvn --batch-mode --no-transfer-progress -f examples/spring-app/pom.xml -Dmaven.test.skip=true package
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
