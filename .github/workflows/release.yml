name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ogiri
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ogiri -d ogiri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Verify source, contracts, dependencies and published consumer
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew clean check dependencyCheckAnalyze publishToMavenLocal --no-daemon
          mvn --batch-mode -f sample/sample-java/pom.xml -Dogiri.version="$RELEASE_VERSION" verify
      - name: Verify PostgreSQL session contracts
        env:
          OGIRI_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/ogiri
          OGIRI_TEST_JDBC_USER: ogiri
          OGIRI_TEST_JDBC_PASSWORD: ogiri
        run: ./gradlew :ogiri-jpa:test --tests '*OgiriJpaStarterIntegrationTest' --rerun-tasks --no-daemon
      - name: Validate the packaged schema with a PostgreSQL Maven consumer
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ogiri
          SPRING_DATASOURCE_USERNAME: ogiri
          SPRING_DATASOURCE_PASSWORD: ogiri
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          unzip -p "ogiri-jpa/build/libs/ogiri-jpa-$version.jar" META-INF/ogiri/schema-postgresql.sql |
            docker exec -i "$POSTGRES_CONTAINER" psql -U ogiri -d ogiri -v ON_ERROR_STOP=1
          mvn --batch-mode -f sample/sample-java/pom.xml -Ppostgresql -Dogiri.version="$version" verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Extract immutable tag version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Validate Central Portal and signing secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required release secret is missing: $name"
              exit 1
            fi
          done
      - name: Publish signed artifacts
        run: ./gradlew publish --no-daemon
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.key: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.GPG_PASSPHRASE }}
      - name: Transfer deployment to Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          set -euo pipefail
          authorization="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $authorization" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.quantipixels?publishing_type=automatic"
      - name: Verify every published module resolves
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          modules=(ogiri-bom ogiri-session-core ogiri-core ogiri-jpa ogiri-redis ogiri-test)
          for attempt in $(seq 1 15); do
            missing=0
            for module in "${modules[@]}"; do
              url="https://repo1.maven.org/maven2/com/quantipixels/ogiri/${module}/${RELEASE_VERSION}/${module}-${RELEASE_VERSION}.pom"
              curl --fail --silent --show-error --head "$url" >/dev/null || missing=1
            done
            if [ "$missing" -eq 0 ]; then exit 0; fi
            sleep 60
          done
          echo "::error::Not every module resolved from Maven Central"
          exit 1

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release after artifact verification
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          name: Release ${{ needs.publish.outputs.version }}
          draft: false
          prerelease: false

  deploy-docs:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Deploy versioned documentation
        run: |
          set -euo pipefail
          minor="$(printf '%s' "${GITHUB_REF_NAME#v}" | grep -oE '^[0-9]+\.[0-9]+')"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases "$minor" latest
          mike set-default --push latest
