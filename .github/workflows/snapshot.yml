name: Snapshot Deployment

on:
  push:
    branches: [ori]
    paths:
      - "ogiri-*/**"
      - "sample/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".ogiri-version"
      - ".github/workflows/snapshot.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Determine snapshot version
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .ogiri-version)"
          test -n "$version"
          echo "value=${version%-SNAPSHOT}-SNAPSHOT" >> "$GITHUB_OUTPUT"
      - name: Verify the snapshot as a Maven consumer
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./gradlew check publishToMavenLocal --no-daemon
          mvn --batch-mode -f sample/sample-java/pom.xml -Dogiri.version="$RELEASE_VERSION" verify
      - name: Publish verified snapshots
        run: ./gradlew publish --no-daemon
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.key: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.GPG_PASSPHRASE }}
