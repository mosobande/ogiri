name: Verify Boot candidate
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/boot-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
          POSTGRES_DB: ogiri_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ogiri -d ogiri_test" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_USER: ogiri
          MYSQL_PASSWORD: ogiri
          MYSQL_DATABASE: ogiri_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
      PGPASSWORD: ogiri
      MYSQL_PWD: ogiri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: build/ogiri-0.1.0
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify exact native source and independent acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          python - <<'PY'
          import os, subprocess, json, base64, pathlib, yaml
          def blob(sha):
              obj=json.loads(subprocess.check_output(['gh','api','repos/quantipixels/ogiri/git/blobs/'+sha]))
              return base64.b64decode(obj['content']).decode()
          source=yaml.safe_load(blob('cc5351eba593a8fed52dfa136ab0ef4314079787'))['jobs']['verify']['steps'][2]['run']
          source=source[source.index("import os,"):source.rfind("\nPY")]
          boundary=source.index('# These immutable commands')
          exec(source[:boundary],globals())
          p=pathlib.Path('ogiri/src/main/resources/META-INF/ogiri/schema-mysql.sql')
          p.write_text(p.read_text().replace('    expires_at bigint NOT NULL CHECK (expires_at > created_at)','    expires_at bigint NOT NULL,\n    CONSTRAINT ogiri_expiry_after_creation CHECK (expires_at > created_at)'))
          subprocess.run(['git','add','-A'],check=True)
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='9021b0fbc1d13cc7360637f17b3351efd1bf7fa7'
          env={**os.environ,'GIT_AUTHOR_NAME':'OpenAI','GIT_AUTHOR_EMAIL':'agent@openai.com','GIT_COMMITTER_NAME':'OpenAI','GIT_COMMITTER_EMAIL':'agent@openai.com','GIT_AUTHOR_DATE':'2026-09-07T08:54:40Z','GIT_COMMITTER_DATE':'2026-09-07T08:54:40Z'}
          subprocess.run(['git','commit','-m','fix: express MySQL expiry validation as a table constraint'],env=env,check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='55fbbeda28dd0ad127fd7a72bbf7c9e7f1c6b708'
          checks=yaml.safe_load(blob('7ae0248bfb362913a789b2467d5ee1bff50e5954'))['jobs']['verify']['steps'][3:6]
          for step in checks:
              print(step['name'],flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',step['run'].replace('in postgresql mysql;', 'in mysql postgresql;')],check=True)
          PY
      - name: Deliver verified source commits
        run: |
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/build/ogiri-0.1.0 | cut -f1)" = 3a763b8305c7fdb41f5ded3779248ec7f28f4240
          git push origin HEAD:refs/heads/build/ogiri-0.1.0
      - name: Preserve exact candidate and logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/source-head.txt"
          git bundle create "$RUNNER_TEMP/proof/candidate.bundle" origin/ori..HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boot-proof
          path: |
            ${{ runner.temp }}/proof
            **/target/surefire-reports/TEST-*.xml
            ogiri/target/*.jar
            ogiri-spring-boot-starter/target/*.jar
          retention-days: 7
