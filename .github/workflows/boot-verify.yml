name: Verify Boot candidate
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/boot-verify.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
          POSTGRES_DB: ogiri_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ogiri -d ogiri_test" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_USER: ogiri
          MYSQL_PASSWORD: ogiri
          MYSQL_DATABASE: ogiri_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
      PGPASSWORD: ogiri
      MYSQL_PWD: ogiri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: build/ogiri-0.1.0
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Restore exact native candidate and patched runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 34103701862 -R quantipixels/ogiri -n boot-proof -D "$RUNNER_TEMP/previous"
          mkdir -p "$RUNNER_TEMP/proof"
          echo "56bd7fca86bfc508ae1e73771c38be4acb97ddd49b4dc6420213f2216ef27d1e  $RUNNER_TEMP/previous/_temp/proof/candidate.bundle" | sha256sum --check
          git fetch "$RUNNER_TEMP/previous/_temp/proof/candidate.bundle" HEAD
          git checkout --detach 2225525c88689fb708fa27ff9a9e0c3a3db40cc2
          python - <<'PY'
          from pathlib import Path
          import os, subprocess
          p=Path('pom.xml');s=p.read_text().replace('    <postgresql.version>', '    <tomcat.version>11.0.25</tomcat.version>\n    <postgresql.version>',1)
          marker='  <dependencyManagement><dependencies>'
          pins='\n    <!-- Boot 4.1.1 predates the fixes for CVE-2026-65905, CVE-2026-65182 and CVE-2026-68525. -->'
          for name in ['core','el','websocket']:
              pins+=f'\n    <dependency><groupId>org.apache.tomcat.embed</groupId><artifactId>tomcat-embed-{name}</artifactId><version>${{tomcat.version}}</version></dependency>'
          p.write_text(s.replace(marker,marker+pins))
          p=Path('examples/spring-app/pom.xml');p.write_text(p.read_text().replace('<java.version>17</java.version>','<java.version>17</java.version><tomcat.version>11.0.25</tomcat.version>'))
          subprocess.run(['git','add','-A'],check=True)
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='07a1892560e833254a9b3b6eb52cef208c5eac84'
          env={**os.environ,'GIT_AUTHOR_NAME':'OpenAI','GIT_AUTHOR_EMAIL':'agent@openai.com','GIT_COMMITTER_NAME':'OpenAI','GIT_COMMITTER_EMAIL':'agent@openai.com','GIT_AUTHOR_DATE':'2026-09-07T09:10:55Z','GIT_COMMITTER_DATE':'2026-09-07T09:10:55Z'}
          subprocess.run(['git','commit','-m','fix: align embedded Tomcat with published security patches'],env=env,check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='09126f274125c8c13071a09885118f1407adeb1d'
          PY
      - name: Rerun database contracts and installed consumers on the patched runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess, json, base64, yaml
          obj=json.loads(subprocess.check_output(['gh','api','repos/quantipixels/ogiri/git/blobs/7ae0248bfb362913a789b2467d5ee1bff50e5954']))
          command=yaml.safe_load(base64.b64decode(obj['content']))['jobs']['verify']['steps'][3]['run']
          command=command.replace('sslMode=DISABLED', 'sslMode=DISABLED&socketTimeout=10000').replace('jdbc:postgresql://localhost:5432/ogiri_test','jdbc:postgresql://localhost:5432/ogiri_test?socketTimeout=10')
          subprocess.run(['bash','-euo','pipefail','-c',command],check=True)
          PY
      - name: Rehearse actual local Maven repository layout without Central upload
        run: |
          set -euo pipefail
          mvn -B -ntp -Prelease -Dgpg.skip=true -DskipTests verify org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy -DaltDeploymentRepository="rehearsal::file://$PWD/target/release-repository" > "$RUNNER_TEMP/proof/release.log" 2>&1 || { tail -100 "$RUNNER_TEMP/proof/release.log"; exit 1; }
          (cd target/release-repository && zip -qr "$RUNNER_TEMP/proof/ogiri-unsigned-bundle.zip" com -x '*/maven-metadata*')
          python - <<'PY'
          from zipfile import ZipFile
          import os
          with ZipFile(os.environ['RUNNER_TEMP']+'/proof/ogiri-unsigned-bundle.zip') as z:
              names=z.namelist()
              assert len([n for n in names if n.endswith('.pom')])==3
              assert len([n for n in names if n.endswith('.jar')])==6
              for n in names:
                  if n.endswith(('.pom','.jar')): assert n+'.sha1' in names and n+'.md5' in names,n
          PY
      - name: Resolve runtime inventories and assess published vulnerabilities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess,json,base64,yaml
          obj=json.loads(subprocess.check_output(['gh','api','repos/quantipixels/ogiri/git/blobs/7ae0248bfb362913a789b2467d5ee1bff50e5954']))
          step=yaml.safe_load(base64.b64decode(obj['content']))['jobs']['verify']['steps'][5]
          subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True)
          PY
      - name: Deliver verified native source commits
        run: |
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/build/ogiri-0.1.0 | cut -f1)" = 3a763b8305c7fdb41f5ded3779248ec7f28f4240
          git push origin HEAD:refs/heads/build/ogiri-0.1.0
      - name: Preserve exact source
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/source-head.txt"
          git bundle create "$RUNNER_TEMP/proof/candidate.bundle" origin/ori..HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boot-proof
          path: |
            ${{ runner.temp }}/proof
            **/target/surefire-reports/TEST-*.xml
            ogiri/target/*.jar
            ogiri-spring-boot-starter/target/*.jar
          retention-days: 7
