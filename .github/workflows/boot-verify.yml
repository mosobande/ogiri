name: Verify Boot candidate
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/boot-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
          POSTGRES_DB: ogiri_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ogiri -d ogiri_test" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_USER: ogiri
          MYSQL_PASSWORD: ogiri
          MYSQL_DATABASE: ogiri_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
      PGPASSWORD: ogiri
      MYSQL_PWD: ogiri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: build/ogiri-0.1.0
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Restore native commits and verify source, consumers, release and dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          python - <<'PY'
          import os, subprocess, json, base64, pathlib, yaml
          def blob(sha):
              obj=json.loads(subprocess.check_output(['gh','api','repos/quantipixels/ogiri/git/blobs/'+sha]))
              return base64.b64decode(obj['content']).decode()
          def run(command): subprocess.run(['bash','-euo','pipefail','-c',command],check=True)
          bootstrap=yaml.safe_load(blob('bc2dac554a77539f194693fe8a9779c0e5d71bd2'))['jobs']['verify']['steps'][1]['run']
          run(bootstrap)
          correction=pathlib.Path(os.environ['RUNNER_TEMP'])/'jpa-correction.py'
          correction.write_text(blob('5449ea4c3f30452d16d68b2679fa7f18b664bbf8'))
          subprocess.run(['python',str(correction)],check=True)
          p=pathlib.Path('ogiri-spring-boot-starter/src/main/java/com/quantipixels/ogiri/spring/OgiriAutoConfiguration.java')
          s=p.read_text().replace('        beforeName = {"org.springframework.boot.security.autoconfigure.servlet.SecurityAutoConfiguration",\n                "org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration"})','        before = {org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration.class,\n                org.springframework.boot.security.oauth2.server.resource.autoconfigure.OAuth2ResourceServerAutoConfiguration.class,\n                org.springframework.boot.security.oauth2.server.resource.autoconfigure.web.OAuth2ResourceServerWebSecurityAutoConfiguration.class})')
          p.write_text(s)
          run('git add -A')
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='f5c0373403d6d2efb70c8642e34e8653d8ac392e'
          env={**os.environ,'GIT_AUTHOR_NAME':'OpenAI','GIT_AUTHOR_EMAIL':'agent@openai.com','GIT_COMMITTER_NAME':'OpenAI','GIT_COMMITTER_EMAIL':'agent@openai.com','GIT_AUTHOR_DATE':'2026-09-07T08:50:11Z','GIT_COMMITTER_DATE':'2026-09-07T08:50:11Z'}
          subprocess.run(['git','commit','-m','fix: order the starter before Spring Boot servlet security defaults'],env=env,check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='b1d5b9d11890ab48d52ba2c32bd5af2cddebb6bf'
          # These immutable commands are the reviewed database, release and OSV checks.
          checks=yaml.safe_load(blob('7ae0248bfb362913a789b2467d5ee1bff50e5954'))['jobs']['verify']['steps'][3:6]
          for step in checks:
              print(step['name'],flush=True)
              run(step['run'])
          PY
      - name: Deliver the verified native source commits
        run: |
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/build/ogiri-0.1.0 | cut -f1)" = 3a763b8305c7fdb41f5ded3779248ec7f28f4240
          git push origin HEAD:refs/heads/build/ogiri-0.1.0
      - name: Preserve exact candidate and logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/source-head.txt"
          git bundle create "$RUNNER_TEMP/proof/candidate.bundle" ori..HEAD || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boot-proof
          path: |
            ${{ runner.temp }}/proof
            **/target/surefire-reports/TEST-*.xml
            ogiri/target/*.jar
            ogiri-spring-boot-starter/target/*.jar
          retention-days: 7
