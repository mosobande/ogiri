name: Verify Boot candidate
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/boot-verify.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: build/ogiri-0.1.0
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Restore exact source and independently retained passing database evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 34103701862 -R quantipixels/ogiri -n boot-proof -D "$RUNNER_TEMP/previous"
          cp -R "$RUNNER_TEMP/previous/_temp/proof" "$RUNNER_TEMP/proof"
          echo "56bd7fca86bfc508ae1e73771c38be4acb97ddd49b4dc6420213f2216ef27d1e  $RUNNER_TEMP/proof/candidate.bundle" | sha256sum --check
          git fetch "$RUNNER_TEMP/proof/candidate.bundle" HEAD
          git checkout --detach 2225525c88689fb708fa27ff9a9e0c3a3db40cc2
          python - <<'PY'
          from pathlib import Path
          import os, xml.etree.ElementTree as E
          for database in ('postgresql','mysql'):
              reports=list((Path(os.environ['RUNNER_TEMP'])/'proof'/database).glob('**/TEST-*.xml'))
              assert len(reports)==6
              total=0
              for p in reports:
                  root=E.parse(p).getroot()
                  total+=int(root.get('tests'))
                  assert not any(int(root.get(k,0)) for k in ('failures','errors','skipped'))
              assert total==22
          PY
      - name: Rehearse unsigned bundle without credentials or upload
        run: |
          set -euo pipefail
          # Central 0.11 requires a server object even in bundle-only mode. These are deliberately unusable placeholders.
          printf '<settings><servers><server><id>central</id><username>bundle-only</username><password>not-a-credential</password></server></servers></settings>' > "$RUNNER_TEMP/bundle-settings.xml"
          mvn -B -ntp -s "$RUNNER_TEMP/bundle-settings.xml" -Prelease -Dcentral.skipPublishing=true -Dgpg.skip=true -DskipTests deploy > "$RUNNER_TEMP/proof/release.log" 2>&1 || { tail -120 "$RUNNER_TEMP/proof/release.log"; exit 1; }
          find . -path '*/central-publishing/*' -type f -exec cp --parents {} "$RUNNER_TEMP/proof/" \;
      - name: Resolve runtime dependency inventories
        run: |
          set -euo pipefail
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DincludeTestScope=false > "$RUNNER_TEMP/proof/sbom.log" 2>&1
          cp target/bom.json "$RUNNER_TEMP/proof/library.cdx.json"
          mvn -B -ntp -Pmysql -f examples/spring-app/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DincludeTestScope=false >> "$RUNNER_TEMP/proof/sbom.log" 2>&1
          cp examples/spring-app/target/bom.json "$RUNNER_TEMP/proof/consumer.cdx.json"
      - name: Assess resolved components against OSV
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  $RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --format=json -L "$RUNNER_TEMP/proof/library.cdx.json" -L "$RUNNER_TEMP/proof/consumer.cdx.json" > "$RUNNER_TEMP/proof/vulnerabilities.json" 2> "$RUNNER_TEMP/proof/vulnerabilities.log"
      - name: Deliver verified native source commits
        run: |
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/build/ogiri-0.1.0 | cut -f1)" = 3a763b8305c7fdb41f5ded3779248ec7f28f4240
          git push origin HEAD:refs/heads/build/ogiri-0.1.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boot-proof
          path: |
            ${{ runner.temp }}/proof
            ogiri/target/*.jar
            ogiri-spring-boot-starter/target/*.jar
          retention-days: 7
