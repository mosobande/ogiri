name: Verify Boot candidate
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/boot-verify.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
          POSTGRES_DB: ogiri_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ogiri -d ogiri_test" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_USER: ogiri
          MYSQL_PASSWORD: ogiri
          MYSQL_DATABASE: ogiri_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
      PGPASSWORD: ogiri
      MYSQL_PWD: ogiri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: build/ogiri-0.1.0
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify source, both engines, release contents and vulnerability remediation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess,json,base64,yaml
          obj=json.loads(subprocess.check_output(['gh','api','repos/quantipixels/ogiri/git/blobs/b304742a5632072c6f6773ce92f6cacd66846511']))
          steps=yaml.safe_load(base64.b64decode(obj['content']))['jobs']['verify']['steps'][2:7]
          for step in steps:
              print('::group::'+step['name'],flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True)
              print('::endgroup::',flush=True)
          PY
      - name: Preserve exact source and report foundation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/proof/report-assets"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/source-head.txt"
          git bundle create "$RUNNER_TEMP/proof/candidate.bundle" origin/ori..HEAD
          for name in base.html logo.svg favicon.png; do
            gh api "repos/quantipixels/skills/contents/skills/productivity/html-artifact/assets/$name?ref=04afa815c7fff238ab945e8e0584147d5ae64389" --jq .content | base64 --decode > "$RUNNER_TEMP/proof/report-assets/$name"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boot-proof
          path: |
            ${{ runner.temp }}/proof
            **/target/surefire-reports/TEST-*.xml
            ogiri/target/*.jar
            ogiri-spring-boot-starter/target/*.jar
          retention-days: 7
