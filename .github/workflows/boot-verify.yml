name: Verify Boot candidate
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/boot-verify.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
          POSTGRES_DB: ogiri_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ogiri -d ogiri_test" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_USER: ogiri
          MYSQL_PASSWORD: ogiri
          MYSQL_DATABASE: ogiri_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
      PGPASSWORD: ogiri
      MYSQL_PWD: ogiri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: build/ogiri-0.1.0
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify exact source against both databases and release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          gh run download 34103194396 -R quantipixels/ogiri -n boot-proof -D "$RUNNER_TEMP/previous"
          echo "2bd120a85b16b0aaea5c0c1e9312de1b1465574916535f5d03af147b21dcdaa1  $RUNNER_TEMP/previous/_temp/proof/candidate.bundle" | sha256sum --check
          git fetch "$RUNNER_TEMP/previous/_temp/proof/candidate.bundle" HEAD
          git checkout --detach 55fbbeda28dd0ad127fd7a72bbf7c9e7f1c6b708
          python - <<'PY'
          from pathlib import Path
          import os, subprocess, json, base64, yaml
          p=Path('examples/spring-app/src/main/resources/application.properties')
          p.write_text(p.read_text().replace('spring.datasource.hikari.data-source-properties.socketTimeout=10\n',''))
          p=Path('README.md'); s=p.read_text()
          paragraph='The starter reuses the application transaction manager, including Spring JPA. With the core alone, pass the manager for the supplied DataSource to `new JdbcSessions(dataSource, policy, transactionManager)`. The two-argument constructor creates a JDBC manager and is intended for JDBC-only transaction contexts. Multiple data sources or managers require an explicitly selected `JdbcSessions` bean; do not select an unrelated manager.'
          s=s.replace('\n'+paragraph+'\n','')
          s=s.replace('Spring `JdbcTransactionManager` and `TransactionTemplate` own commit, rollback and resource restoration.', 'Spring transaction management and `TransactionTemplate` own commit, rollback and resource restoration.')
          s=s.replace('reads suspend an outer JDBC transaction','reads suspend an outer JDBC or JPA transaction')
          s=s.replace('Each authentication performs',paragraph+'\n\nEach authentication performs')
          s=s.replace('Configure those through your pool/server.', 'Configure those through your pool/server. JDBC driver timeout units differ: PostgreSQL `socketTimeout` uses seconds; MySQL uses milliseconds. Do not share that numeric setting between drivers.')
          p.write_text(s)
          p=Path('examples/spring-app/README.md'); p.write_text(p.read_text()+'\nConfigure driver-specific socket timeouts in the JDBC URL: PostgreSQL uses `socketTimeout=10` for ten seconds, while MySQL uses `socketTimeout=10000`. The common application properties intentionally do not set a driver-specific socket timeout. See [pgJDBC parameters](https://jdbc.postgresql.org/documentation/use/) and [Connector/J networking](https://dev.mysql.com/doc/connector-j/en/connector-j-connp-props-networking.html).\n')
          subprocess.run(['git','add','-A'],check=True)
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='12b858412a3737eaeecc88853439640da2847f85'
          env={**os.environ,'GIT_AUTHOR_NAME':'OpenAI','GIT_AUTHOR_EMAIL':'agent@openai.com','GIT_COMMITTER_NAME':'OpenAI','GIT_COMMITTER_EMAIL':'agent@openai.com','GIT_AUTHOR_DATE':'2026-09-07T09:00:39Z','GIT_COMMITTER_DATE':'2026-09-07T09:00:39Z'}
          subprocess.run(['git','commit','-m','fix: keep database-specific timeout units out of shared Boot configuration'],env=env,check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='2225525c88689fb708fa27ff9a9e0c3a3db40cc2'
          obj=json.loads(subprocess.check_output(['gh','api','repos/quantipixels/ogiri/git/blobs/7ae0248bfb362913a789b2467d5ee1bff50e5954']))
          checks=yaml.safe_load(base64.b64decode(obj['content']))['jobs']['verify']['steps'][3:6]
          for step in checks:
              print(step['name'],flush=True)
              command=step['run'].replace('in postgresql mysql;', 'in mysql postgresql;')
              command=command.replace('sslMode=DISABLED', 'sslMode=DISABLED&socketTimeout=10000')
              command=command.replace('jdbc:postgresql://localhost:5432/ogiri_test','jdbc:postgresql://localhost:5432/ogiri_test?socketTimeout=10')
              subprocess.run(['bash','-euo','pipefail','-c',command],check=True)
          PY
      - name: Deliver verified source commits
        run: |
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/build/ogiri-0.1.0 | cut -f1)" = 3a763b8305c7fdb41f5ded3779248ec7f28f4240
          git push origin HEAD:refs/heads/build/ogiri-0.1.0
      - name: Preserve exact candidate and logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/source-head.txt"
          git bundle create "$RUNNER_TEMP/proof/candidate.bundle" origin/ori..HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boot-proof
          path: |
            ${{ runner.temp }}/proof
            **/target/surefire-reports/TEST-*.xml
            ogiri/target/*.jar
            ogiri-spring-boot-starter/target/*.jar
          retention-days: 7
