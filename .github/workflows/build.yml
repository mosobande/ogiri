name: Build
on:
  pull_request:
  push:
    branches: [ori, build/ogiri-0.1.0]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Java ${{ matrix.java }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            postgres: '16'
          - java: '25'
            postgres: '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
          POSTGRES_DB: ogiri_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ogiri -d ogiri_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OGIRI_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/ogiri_test
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify and install the two library artifacts
        run: mvn --batch-mode --no-transfer-progress clean install
      - name: Apply the PostgreSQL schema from the built JAR
        env:
          PGPASSWORD: ogiri
        run: |
          set -euo pipefail
          psql -h localhost -U ogiri -d ogiri_test -v ON_ERROR_STOP=1 -c 'DROP TABLE ogiri_sessions'
          unzip -p ogiri/target/ogiri-0.1.0.jar META-INF/ogiri/schema-postgresql.sql | psql -h localhost -U ogiri -d ogiri_test -v ON_ERROR_STOP=1
      - name: Verify the independently resolved consumer over real HTTP
        run: mvn --batch-mode --no-transfer-progress -f examples/spring-app/pom.xml verify
      - name: Inspect packaged API documentation and test evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, xml.etree.ElementTree as E
          results=[]
          for module in ('ogiri','ogiri-spring-security','examples/spring-app'):
              reports=list(Path(module).glob('target/surefire-reports/TEST-*.xml'))
              assert reports, f'Missing test evidence: {module}'
              for report in reports:
                  root=E.parse(report).getroot()
                  counts={key:int(root.get(key,0)) for key in ('tests','failures','errors','skipped')}
                  assert counts['tests'] and not any(counts[k] for k in ('failures','errors','skipped')), (module,counts)
                  results.append({'module':module,'suite':root.get('name'),**counts})
          for module in ('ogiri','ogiri-spring-security'):
              with ZipFile(f'{module}/target/{module}-0.1.0-javadoc.jar') as jar:
                  assert any(name.endswith('.html') for name in jar.namelist()), module
              with ZipFile(f'{module}/target/{module}-0.1.0-sources.jar') as jar:
                  assert any(name.endswith('.java') for name in jar.namelist()), module
          with ZipFile('ogiri/target/ogiri-0.1.0.jar') as jar:
              assert 'META-INF/ogiri/schema-postgresql.sql' in jar.namelist()
              assert not any(name.startswith('db/migration/') or name.endswith('.kotlin_module') for name in jar.namelist())
          Path('target').mkdir(exist_ok=True)
          Path('target/verification.json').write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-java${{ matrix.java }}-postgres${{ matrix.postgres }}
          path: |
            target/verification.json
            **/target/surefire-reports/TEST-*.xml
            ogiri/target/*.jar
            ogiri-spring-security/target/*.jar
          retention-days: 7
