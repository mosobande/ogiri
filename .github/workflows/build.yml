name: Build

on:
  push:
    branches: [ori]
  pull_request:
    branches: [ori]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Verify all modules and stage Maven publications
        run: ./gradlew check publishToMavenLocal --no-daemon
      - name: Test a standalone Java Maven consumer
        run: mvn --batch-mode -f sample/sample-java/pom.xml -Dogiri.version="$(cat .ogiri-version)" verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification
          path: |
            **/build/test-results/test/*.xml
            **/build/libs/*.jar
            **/build/publications/mavenJava/pom-default.xml
            sample/sample-java/target/surefire-reports/*.xml
