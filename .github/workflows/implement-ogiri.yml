name: Verify Java-first Ogiri
on:
  push:
    branches: [build/ogiri-execution]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ogiri
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ogiri -d ogiri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: build/java-first-auth
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Apply the reviewed metadata correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a6add2ab7fe650a12541a381c6d2861a62773304
          gh api repos/quantipixels/ogiri/git/blobs/50d797248c4a239b258c8b210703a69e5d3260d5 --jq .content | base64 --decode > "$RUNNER_TEMP/change.py"
          python "$RUNNER_TEMP/change.py"
          ./gradlew spotlessApply --no-daemon
          git restore --source=HEAD --staged --worktree .github/workflows
      - name: Verify all contracts and Maven publications
        run: |
          set -o pipefail
          ./gradlew check publishToMavenLocal --continue --no-daemon 2>&1 | tee "$RUNNER_TEMP/verification.log"
      - name: Preserve H2 Redis HTTP and Java results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/contract-results"
          find . -path '*/build/test-results/test/TEST-*.xml' -exec cp --parents {} "$RUNNER_TEMP/contract-results" \;
      - name: Verify generated publication contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          version=Path('.ogiri-version').read_text().strip()
          for module in ['ogiri-session-core','ogiri-core','ogiri-jpa','ogiri-redis','ogiri-test']:
              p=Path(module)/'build/libs'/f'{module}-{version}-javadoc.jar'
              with ZipFile(p) as archive:
                  pages=[n for n in archive.namelist() if n.endswith('.html')]
                  print('API PAGES',module,len(pages)); assert pages
          with ZipFile(f'ogiri-core/build/libs/ogiri-core-{version}.jar') as archive:
              metadata=json.loads(archive.read('META-INF/spring-configuration-metadata.json'))
              names={p['name'] for p in metadata['properties']}
              print('CONFIGURATION METADATA',sorted(names))
              required={'ogiri.session.enabled','ogiri.session.transport','ogiri.session.endpoints.base-path','ogiri.session.cookie.secure','ogiri.session.token-hash.current-key-id','ogiri.session.rate-limit.window','ogiri.session.cleanup.batch-size'}
              assert required <= names, required-names
              assert not any(n.startswith('ogiri.auth.') for n in names)
          PY
      - name: Verify PostgreSQL session contracts
        env:
          OGIRI_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/ogiri
          OGIRI_TEST_JDBC_USER: ogiri
          OGIRI_TEST_JDBC_PASSWORD: ogiri
        run: ./gradlew :ogiri-jpa:test --tests '*OgiriJpaStarterIntegrationTest' --rerun-tasks --no-daemon
      - name: Test standalone Maven consumer
        run: mvn --batch-mode -f sample/sample-java/pom.xml -Dogiri.version="$(cat .ogiri-version)" verify
      - name: Commit and push the verified correction
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ogiri-core/src/main/kotlin/com/quantipixels/ogiri/security/session/OgiriSessionProperties.kt
          git commit --quiet -m 'fix: generate complete metadata for immutable session configuration'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/build/java-first-auth
          git log -1 --format='%H %s'
      - name: Summarize verified contracts
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, xml.etree.ElementTree as E
          for label,directory,pattern in [('H2/Redis/HTTP/Java',Path(os.environ['RUNNER_TEMP'])/'contract-results','**/TEST-*.xml'),('PostgreSQL',Path('ogiri-jpa/build/test-results/test'),'TEST-*.xml'),('Maven',Path('sample/sample-java/target/surefire-reports'),'TEST-*.xml')]:
              total=failed=skipped=0
              for p in directory.glob(pattern):
                  root=E.parse(p).getroot()
                  total+=int(root.get('tests',0)); failed+=int(root.get('failures',0))+int(root.get('errors',0)); skipped+=int(root.get('skipped',0))
                  for error in root.findall('.//failure')+root.findall('.//error'): print(p,error.get('message'),(error.text or '')[:1500])
              print(f'{label}: total={total} failed={failed} skipped={skipped}')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ogiri-verification
          path: |
            ${{ runner.temp }}/verification.log
            ${{ runner.temp }}/contract-results
            **/build/test-results/test/*.xml
            **/build/libs/*.jar
            **/build/publications/mavenJava/pom-default.xml
            sample/sample-java/target/surefire-reports/*.xml
          retention-days: 3
