name: Verify Java-first Ogiri
on:
  push:
    branches: [build/ogiri-execution]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: build/java-first-auth
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Apply reviewed changes to the expected branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 64008fa2b8387e6ba14f4d7c7f058cc56a3dc49f
          gh api repos/quantipixels/ogiri/git/blobs/1ada8c4f62e0f5684448ba10e5acc4ea47ecee11 --jq .content | base64 --decode > "$RUNNER_TEMP/change.py"
          python "$RUNNER_TEMP/change.py"
          git rm .github/workflows/audit-checkout.yml
      - name: Format source
        run: ./gradlew spotlessApply --no-daemon
      - name: Commit the coherent security and integration change
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden v4 session credentials and Java Spring integration'
          git push origin HEAD:refs/heads/build/java-first-auth
          git rev-parse HEAD
      - name: Verify source and all current consumers
        run: |
          set -o pipefail
          ./gradlew check --continue --no-daemon 2>&1 | tee "$RUNNER_TEMP/verification.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ogiri-verification
          path: |
            ${{ runner.temp }}/verification.log
            **/build/test-results/test/*.xml
          retention-days: 3
