name: Verify Java-first Ogiri
on:
  push:
    branches: [build/ogiri-execution]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ogiri
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ogiri -d ogiri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: build/java-first-auth
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Apply reviewed packaging corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = aa1902238b004b1c13d3c1c4057f6ccb9356b993
          gh api repos/quantipixels/ogiri/git/blobs/106c4925514420b57a16c99629e70c84284c8383 --jq .content | base64 --decode > "$RUNNER_TEMP/change.py"
          python "$RUNNER_TEMP/change.py"
      - name: Format source
        run: ./gradlew spotlessApply --no-daemon
      - name: Commit and verify tracked resources
        id: commit
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore sample ogiri-core
          git commit --quiet -m 'fix: track runnable sample configuration and preserve authentication failures'
          git add -A
          git commit --quiet -m 'build: generate configuration metadata and retire stale client guidance'
          git ls-files --error-unmatch sample/sample-java/src/main/resources/application.yml sample/sample-kotlin/src/main/resources/application.yml
          git push origin HEAD:refs/heads/build/java-first-auth
          git log -2 --format='%H %s'
      - name: Verify H2 Redis HTTP Java and Maven publications
        run: |
          set -o pipefail
          ./gradlew check publishToMavenLocal --continue --no-daemon 2>&1 | tee "$RUNNER_TEMP/verification.log"
      - name: Preserve first-pass results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/contract-results"
          find . -path '*/build/test-results/test/TEST-*.xml' -exec cp --parents {} "$RUNNER_TEMP/contract-results" \;
      - name: Verify PostgreSQL concurrency and transaction boundaries
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        env:
          OGIRI_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/ogiri
          OGIRI_TEST_JDBC_USER: ogiri
          OGIRI_TEST_JDBC_PASSWORD: ogiri
        run: ./gradlew :ogiri-jpa:test --tests '*OgiriJpaStarterIntegrationTest' --rerun-tasks --no-daemon
      - name: Test standalone Maven consumer
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: mvn --batch-mode -f sample/sample-java/pom.xml -Dogiri.version="$(cat .ogiri-version)" verify
      - name: Inspect actual publication contents and contract results
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, os
          import xml.etree.ElementTree as E
          for label, directory, pattern in [('H2/Redis/HTTP/Java', Path(os.environ['RUNNER_TEMP'])/'contract-results', '**/TEST-*.xml'), ('PostgreSQL', Path('ogiri-jpa/build/test-results/test'), 'TEST-*.xml'), ('Maven', Path('sample/sample-java/target/surefire-reports'), 'TEST-*.xml')]:
              total = failed = skipped = 0
              for p in directory.glob(pattern):
                  root=E.parse(p).getroot()
                  total+=int(root.get('tests',0)); failed+=int(root.get('failures',0))+int(root.get('errors',0)); skipped+=int(root.get('skipped',0))
                  for case in root.findall('testcase'):
                      for error in list(case.findall('failure'))+list(case.findall('error')):
                          print(p,case.get('name'),error.get('message'),(error.text or '')[:3000])
                  if root.findall('.//failure'): print((root.findtext('system-out') or '')[-10000:])
              print(f'{label}: total={total} failed={failed} skipped={skipped}')
          for p in Path('.').glob('ogiri-*/build/libs/*-javadoc.jar'):
              with ZipFile(p) as archive:
                  pages=[n for n in archive.namelist() if n.endswith('.html')]
                  print('API PAGES',p,len(pages)); assert pages
          with ZipFile('ogiri-core/build/libs/ogiri-core-4.0.0.jar') as archive:
              metadata=json.loads(archive.read('META-INF/spring-configuration-metadata.json'))
              names={p['name'] for p in metadata['properties']}
              print('CONFIGURATION METADATA',sorted(names))
              assert 'ogiri.session.enabled' in names and 'ogiri.session.endpoints.base-path' in names
              assert not any(n.startswith('ogiri.auth.') for n in names)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ogiri-verification
          path: |
            ${{ runner.temp }}/verification.log
            ${{ runner.temp }}/contract-results
            **/build/test-results/test/*.xml
            **/build/libs/*.jar
            **/build/publications/mavenJava/pom-default.xml
            sample/sample-java/target/surefire-reports/*.xml
          retention-days: 3
