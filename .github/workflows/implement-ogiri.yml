name: Verify Java-first Ogiri
on:
  push:
    branches: [build/ogiri-execution]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: build/java-first-auth
          fetch-depth: 0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Apply reviewed v4 cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 73eef6171c081703cd98bac63968107a428a051d
          gh api repos/quantipixels/ogiri/git/blobs/1ef0457416d76ecb53a95baac2428da20ac5f95a --jq .content | base64 --decode > "$RUNNER_TEMP/change.py"
          python "$RUNNER_TEMP/change.py"
      - name: Format source
        run: ./gradlew spotlessApply --no-daemon
      - name: Commit the coherent library migration
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor!: retire v3 adapters and ship native Maven consumers'
          git push origin HEAD:refs/heads/build/java-first-auth
          git rev-parse HEAD
      - name: Verify and publish locally
        run: |
          set -o pipefail
          ./gradlew check publishToMavenLocal --continue --no-daemon 2>&1 | tee "$RUNNER_TEMP/verification.log"
      - name: Test standalone Maven consumer
        run: mvn --batch-mode -f sample/sample-java/pom.xml -Dogiri.version="$(cat .ogiri-version)" verify
      - name: Summarize contract test results
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          total = failed = skipped = 0
          for p in Path('.').glob('**/test-results/test/TEST-*.xml'):
              root = E.parse(p).getroot()
              total += int(root.get('tests', 0)); failed += int(root.get('failures', 0)) + int(root.get('errors', 0)); skipped += int(root.get('skipped', 0))
              for case in root.findall('testcase'):
                  for error in list(case.findall('failure')) + list(case.findall('error')):
                      print(p, case.get('name'), error.get('message'), (error.text or '')[:3000])
              if root.findall('.//failure'):
                  print((root.findtext('system-out') or '')[-14000:])
          print(f'TEST SUMMARY: total={total} failed={failed} skipped={skipped}')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ogiri-verification
          path: |
            ${{ runner.temp }}/verification.log
            **/build/test-results/test/*.xml
            **/build/libs/*.jar
            **/build/publications/mavenJava/pom-default.xml
            sample/sample-java/target/surefire-reports/*.xml
          retention-days: 3
