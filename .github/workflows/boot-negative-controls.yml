name: Boot negative controls
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/boot-negative-controls.yml]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_USER: ogiri
          MYSQL_PASSWORD: ogiri
          MYSQL_DATABASE: ogiri_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      OGIRI_TEST_DATABASE: mysql
      OGIRI_TEST_JDBC_URL: jdbc:mysql://localhost:3306/ogiri_test?allowPublicKeyRetrieval=true&sslMode=DISABLED&socketTimeout=10000
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: d3bcd23411eda70f799e958a7db4299f22ffd816
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Prove baseline then independently challenge three security boundaries
        run: |
          python - <<'PY'
          import os,subprocess,json,shutil,xml.etree.ElementTree as E
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'negative-controls';out.mkdir()
          code=Path('ogiri/src/main/java/com/quantipixels/ogiri/JdbcSessions.java')
          original=code.read_text()
          proof=Path('ogiri/target/surefire-reports/TEST-com.quantipixels.ogiri.JdbcSessionsTest.xml')
          def run(label,test=None):
              command=['mvn','-B','-ntp','-pl','ogiri','test']
              if test: command+=['-Dtest=JdbcSessionsTest#'+test]
              if proof.exists(): proof.unlink()
              with (out/(label+'.log')).open('w') as log:
                  result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT)
              assert proof.exists(),label+' produced no executed-test XML'
              root=E.parse(proof).getroot()
              shutil.copyfile(proof,out/(label+'.xml'))
              assert int(root.get('tests',0))>0 and int(root.get('skipped',0))==0
              return result.returncode,root
          result,root=run('baseline');assert result==0 and int(root.get('failures',0))+int(root.get('errors',0))==0
          cases=[
              ('missing-expiry','token_hash = ? AND expires_at > ','token_hash = ? AND expires_at > 0 * ','authenticationDoesNotWriteOrSlideExpiryAndExpiredRowsCannotAuthenticate'),
              ('missing-tenant','tenant_id = ? AND subject_id','? IS NOT NULL AND subject_id','managementUsesEveryIdentityComponentAndNeverTrustsTheSessionIdAlone'),
              ('stale-host-snapshot','PROPAGATION_NOT_SUPPORTED','PROPAGATION_SUPPORTS','springTransactionsDoNotUndoCommittedSessionChangesOrCacheRevocation')]
          outcomes=[]
          try:
              for label,before,after,test in cases:
                  assert original.count(before)==1,(label,'ambiguous mutation')
                  code.write_text(original.replace(before,after))
                  result,root=run(label,test)
                  assert result!=0 and int(root.get('failures',0))>0 and int(root.get('errors',0))==0,label
                  outcomes.append({'mutation':label,'test':test,'outcome':'detected by executed assertion','failures':int(root.get('failures'))})
          finally:
              code.write_text(original)
          result,root=run('restored');assert result==0 and int(root.get('failures',0))+int(root.get('errors',0))==0
          subprocess.run(['git','diff','--exit-code'],check=True)
          outcomes={'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'database':'MySQL 8.4','mutations':outcomes,'source_restored':True,'baseline_tests':11,'restored_tests':int(root.get('tests'))}
          (out/'outcomes.json').write_text(json.dumps(outcomes,indent=2)+'\n')
          subprocess.run(['git','bundle','create',str(out/'candidate.bundle'),'origin/ori..HEAD'],check=True)
          print(json.dumps(outcomes,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boot-negative-controls
          path: ${{ runner.temp }}/negative-controls
          retention-days: 7
