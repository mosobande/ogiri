name: Verify optional cache support
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/cache-support-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
          POSTGRES_DB: ogiri_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ogiri -d ogiri_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_USER: ogiri
          MYSQL_PASSWORD: ogiri
          MYSQL_DATABASE: ogiri_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
      PGPASSWORD: ogiri
      MYSQL_PWD: ogiri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: d3bcd23411eda70f799e958a7db4299f22ffd816
          fetch-depth: 0
      - name: Restore the locally authored source and correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-proof"
          python - <<'PY'
          import os, subprocess, json, base64, pathlib, hashlib
          parts=['bc9c64028618e7b1799bb3196be47397d5734834','af086e154cf68174c34988dfff18c4719a6f740a','7345e888f417e6b6bb1a99fda41af390a4d113fe','9042bac34156278db43cd5215fc43dff3a796004']
          data=b''.join(base64.b64decode(json.loads(subprocess.check_output(['gh','api','repos/quantipixels/ogiri/git/blobs/'+sha]))['content']) for sha in parts)
          assert hashlib.sha256(data).hexdigest()=='b2d8e05fad91ef15e03483851a630facb9f8b6835d896659f72ad62fc34c7885'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'cache.bundle'
          path.write_bytes(data)
          subprocess.run(['git','fetch',str(path),'HEAD'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick 8b3e28046f660a301b42ce62b3e93a944dd37296
          python - <<'PY'
          from pathlib import Path
          import subprocess
          for name in ('SessionCacheTest','JdbcSessionsTest'):
              path=Path('ogiri/src/test/java/com/quantipixels/ogiri')/(name+'.java')
              text=path.read_text().replace('        manager.setStoreByValue(true);','        manager.setStoreByValue(true);\n        manager.setBeanClassLoader('+name+'.class.getClassLoader());')
              path.write_text(text)
          path=Path('SECURITY.md')
          text=path.read_text().replace('Read operations suspend outer JDBC transactions and query the primary.', 'Database read operations suspend outer JDBC or JPA transactions and query the primary.')
          text=text.replace('No authentication-positive cache exists. Storage/directory outages fail closed and remain distinct from invalid credentials.', 'With caching disabled (the default), every session validation queries authoritative storage. Storage/directory failures remain distinct from invalid credentials. Opt-in caching changes revocation and database-outage behavior as described below.')
          path.write_text(text)
          expected={'SECURITY.md':'6f71245c046cc6b88f3e9b9774969069c97fed95','ogiri/src/test/java/com/quantipixels/ogiri/JdbcSessionsTest.java':'b83cf4d41977c36ae8332b9176f1b9bf3ef91775','ogiri/src/test/java/com/quantipixels/ogiri/SessionCacheTest.java':'8dfaa479c837afd1c07b59f721e3b7dc74d3e145'}
          for path,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha, path
          PY
          git add SECURITY.md ogiri/src/test/java/com/quantipixels/ogiri/JdbcSessionsTest.java ogiri/src/test/java/com/quantipixels/ogiri/SessionCacheTest.java
          git commit --author='Olúwaṣèyí <52331341+mosobande@users.noreply.github.com>' -m 'test: exercise serialized session cache values and clarify optional consistency'
          git diff --check
          git rev-parse HEAD > "$RUNNER_TEMP/cache-proof/source-head.txt"
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify default and cached contracts on both database engines
        run: |
          set -euo pipefail
          for db in postgresql mysql; do
            export OGIRI_TEST_DATABASE="$db"
            if [ "$db" = postgresql ]; then
              export OGIRI_TEST_JDBC_URL='jdbc:postgresql://localhost:5432/ogiri_test?socketTimeout=10'
            else
              export OGIRI_TEST_JDBC_URL='jdbc:mysql://localhost:3306/ogiri_test?allowPublicKeyRetrieval=true&sslMode=DISABLED&socketTimeout=10000'
            fi
            out="$RUNNER_TEMP/cache-proof/$db"
            mkdir -p "$out"
            mvn -B -ntp clean install > "$out/library.log" 2>&1 || { tail -120 "$out/library.log"; exit 1; }
            if [ "$db" = postgresql ]; then
              psql -h localhost -U ogiri -d ogiri_test -v ON_ERROR_STOP=1 -c 'DROP TABLE ogiri_sessions, ogiri_subject_locks'
              unzip -p ogiri/target/ogiri-0.1.0.jar META-INF/ogiri/schema-postgresql.sql | psql -h localhost -U ogiri -d ogiri_test -v ON_ERROR_STOP=1
            else
              mysql -h 127.0.0.1 -u ogiri ogiri_test -e 'DROP TABLE ogiri_sessions, ogiri_subject_locks'
              unzip -p ogiri/target/ogiri-0.1.0.jar META-INF/ogiri/schema-mysql.sql | mysql -h 127.0.0.1 -u ogiri ogiri_test
            fi
            mvn -B -ntp -Pmysql -f examples/spring-app/pom.xml verify > "$out/consumer.log" 2>&1 || { tail -160 "$out/consumer.log"; exit 1; }
            find . -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} "$out" \;
          done
      - name: Non-force push the verified coherent source changes
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/build/ogiri-0.1.0
      - name: Preserve candidate and proof
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cache-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/cache-proof/source-head.txt"
          git bundle create "$RUNNER_TEMP/cache-proof/candidate.bundle" d3240a405722689e608873a65c419ef0c3658739..HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cache-support-proof
          path: |
            ${{ runner.temp }}/cache-proof
            **/target/surefire-reports/TEST-*.xml
            ogiri/target/*.jar
            ogiri-spring-boot-starter/target/*.jar
          retention-days: 7
