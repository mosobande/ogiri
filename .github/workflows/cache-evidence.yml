name: Read cache decision evidence
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/cache-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read checksum-verified prior benchmark results without executing archive content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/quantipixels/ogiri/actions/artifacts/10012065646/zip > "$RUNNER_TEMP/proof.zip"
          echo "7f96a3b15f9a0cf156bbd4a6ab139b44a1244b104328293c52198de9be6c0915  $RUNNER_TEMP/proof.zip" | sha256sum --check
          python - <<'PY'
          import json, os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(Path(os.environ['RUNNER_TEMP'])/'proof.zip') as archive:
              found = []
              for item in archive.infolist():
                  name = item.filename
                  if name.endswith('source-head.txt'):
                      print('Measured source:', archive.read(item).decode().strip())
                  if Path(name).name.startswith('benchmark-') and name.endswith('.json'):
                      assert item.file_size < 100000, 'Unexpected benchmark size'
                      data = json.loads(archive.read(item))
                      found.append(data)
              assert len(found) == 2, f'Expected two database benchmark records, got {len(found)}'
              for data in found:
                  print('BENCHMARK', json.dumps(data, sort_keys=True))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as summary:
                  summary.write('## Preserved cache decision evidence\n\nSource artifact: 10012065646, run 34104926861. No new benchmark executed.\n\n```json\n'+json.dumps(found, indent=2)+'\n```\n')
          PY
