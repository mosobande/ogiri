name: Greenfield verification
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/greenfield-build.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
          POSTGRES_DB: ogiri_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ogiri -d ogiri_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OGIRI_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/ogiri_test
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ori
          fetch-depth: 0
      - name: Apply reviewed source in the native checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d3240a405722689e608873a65c419ef0c3658739
          git checkout -b build/ogiri-0.1.0
          for blob in a2803082e6333b57f34b9e52b6d8a5f876ab1716 4268041b09e68d17d19724a3104ba0a3d06c31e0 92af3759301b16a07219bcd0d33803b98cd764b7 0b70445c096005a9e68d526e676662cf50f9c36b fe03ff58c49625ebb3f8ee7dd6b71fc35d397d51; do
            gh api "repos/quantipixels/ogiri/git/blobs/$blob" --jq .content | base64 --decode > "$RUNNER_TEMP/source.py"
            python "$RUNNER_TEMP/source.py"
          done
          git diff --check
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile test package and install both libraries
        run: |
          mvn --batch-mode --no-transfer-progress clean install > "$RUNNER_TEMP/maven.log" 2>&1 || { tail -100 "$RUNNER_TEMP/maven.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/maven.log"
      - name: Apply the schema from the actual installed artifact
        env:
          PGPASSWORD: ogiri
        run: |
          set -euo pipefail
          psql -h localhost -U ogiri -d ogiri_test -v ON_ERROR_STOP=1 -c 'DROP TABLE ogiri_sessions'
          unzip -p ogiri/target/ogiri-0.1.0.jar META-INF/ogiri/schema-postgresql.sql | psql -h localhost -U ogiri -d ogiri_test -v ON_ERROR_STOP=1
      - name: Test independently resolved Spring Boot consumer over HTTP
        run: |
          mvn --batch-mode --no-transfer-progress -f examples/spring-app/pom.xml verify > "$RUNNER_TEMP/consumer.log" 2>&1 || { tail -130 "$RUNNER_TEMP/consumer.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/consumer.log"
      - name: Preserve baseline behavioural evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-tests"
          find . -path '*/target/surefire-reports/TEST-*.xml' -exec cp --parents {} "$RUNNER_TEMP/baseline-tests" \;
      - name: Challenge high-risk predicates with deliberate wrong implementations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/quantipixels/ogiri/git/blobs/64f9d3ba07eddb1a6f5dcef9785532ddb75f2cd4 --jq .content | base64 --decode > "$RUNNER_TEMP/mutations.py"
          python "$RUNNER_TEMP/mutations.py"
      - name: Reverify restored source before native commit
        run: |
          mvn --batch-mode --no-transfer-progress clean install > "$RUNNER_TEMP/restored.log" 2>&1 || { tail -100 "$RUNNER_TEMP/restored.log"; exit 1; }
          mvn --batch-mode --no-transfer-progress -f examples/spring-app/pom.xml verify >> "$RUNNER_TEMP/restored.log" 2>&1 || { tail -100 "$RUNNER_TEMP/restored.log"; exit 1; }
          git diff --check
      - name: Commit and non-force push the verified greenfield library
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat | tail -8
          git commit -m 'feat!: rebuild Ogiri as a focused Java PostgreSQL session library at 0.1.0'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/build/ogiri-0.1.0
          git rev-parse HEAD
          git log -1 --format='%H %s'
      - name: Capture actual test outcomes and exact source
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, xml.etree.ElementTree as E
          for file in (Path(os.environ['RUNNER_TEMP'])/'baseline-tests').glob('**/TEST-*.xml'):
              root=E.parse(file).getroot()
              print(root.get('name'), {k:root.get(k) for k in ('tests','failures','errors','skipped')})
              for case in root.findall('testcase'):
                  for error in case.findall('failure') + case.findall('error'):
                      print(case.get('name'), error.get('message'), (error.text or '')[:3000])
          PY
          tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/greenfield-source.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: greenfield-proof
          path: |
            ${{ runner.temp }}/greenfield-source.tar.gz
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/baseline-tests
            ${{ runner.temp }}/mutation-evidence
            **/target/*.jar
          retention-days: 7
