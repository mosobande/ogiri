name: Greenfield verification
on:
  push:
    branches: [build/ogiri-execution]
    paths: [.github/workflows/greenfield-build.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ogiri
          POSTGRES_PASSWORD: ogiri
          POSTGRES_DB: ogiri_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ogiri -d ogiri_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OGIRI_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/ogiri_test
      OGIRI_TEST_JDBC_USER: ogiri
      OGIRI_TEST_JDBC_PASSWORD: ogiri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ori
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed source in the native checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d3240a405722689e608873a65c419ef0c3658739
          for blob in a2803082e6333b57f34b9e52b6d8a5f876ab1716 4268041b09e68d17d19724a3104ba0a3d06c31e0 92af3759301b16a07219bcd0d33803b98cd764b7 0b70445c096005a9e68d526e676662cf50f9c36b; do
            gh api "repos/quantipixels/ogiri/git/blobs/$blob" --jq .content | base64 --decode > "$RUNNER_TEMP/source.py"
            python "$RUNNER_TEMP/source.py"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('examples/spring-app/src/main/java/example/ogiri/Application.java')
          s=p.read_text().replace('            catch (AuthenticationException invalid)', '            catch (AuthenticationServiceException unavailable) { throw new ResponseStatusException(HttpStatus.SERVICE_UNAVAILABLE); }\n            catch (AuthenticationException invalid)')
          p.write_text(s)
          PY
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile test package and install both libraries
        run: |
          mvn --batch-mode --no-transfer-progress clean install > "$RUNNER_TEMP/maven.log" 2>&1 || { tail -120 "$RUNNER_TEMP/maven.log"; exit 1; }
          tail -25 "$RUNNER_TEMP/maven.log"
      - name: Apply the schema from the actual installed artifact
        env:
          PGPASSWORD: ogiri
        run: |
          set -euo pipefail
          psql -h localhost -U ogiri -d ogiri_test -v ON_ERROR_STOP=1 -c 'DROP TABLE ogiri_sessions'
          unzip -p ogiri/target/ogiri-0.1.0.jar META-INF/ogiri/schema-postgresql.sql | psql -h localhost -U ogiri -d ogiri_test -v ON_ERROR_STOP=1
      - name: Test the independently resolved Spring Boot consumer over HTTP
        run: |
          mvn --batch-mode --no-transfer-progress -f examples/spring-app/pom.xml verify > "$RUNNER_TEMP/consumer.log" 2>&1 || { tail -140 "$RUNNER_TEMP/consumer.log"; exit 1; }
          tail -25 "$RUNNER_TEMP/consumer.log"
      - name: Capture actual test outcomes and source
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for file in Path('.').glob('**/target/surefire-reports/TEST-*.xml'):
              root=E.parse(file).getroot()
              print(root.get('name'), {k:root.get(k) for k in ('tests','failures','errors','skipped')})
              for case in root.findall('testcase'):
                  for error in case.findall('failure') + case.findall('error'):
                      print(case.get('name'), error.get('message'), (error.text or '')[:5000])
          PY
          tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/greenfield-source.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: greenfield-initial-verification
          path: |
            ${{ runner.temp }}/greenfield-source.tar.gz
            ${{ runner.temp }}/maven.log
            ${{ runner.temp }}/consumer.log
            **/target/surefire-reports/TEST-*.xml
            **/target/*.jar
          retention-days: 7
